name: ios
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
env:
  HORIZON_TELEMETRY_URL: "off"
  IOS_TARGET: aarch64-apple-ios
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_INCREMENTAL: "0"
jobs:
  game-with-launcher:
    name: horizon-ios-game-with-launcher
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.IOS_TARGET }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-${{ env.IOS_TARGET }}
      - name: Configure Microsoft sign-in
        env:
          CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :HorizonMSAClientID $CLIENT_ID" packaging/ios/GameInfo.plist
          fi
      - name: Build the game for iPhone and iPad
        run: cargo build --release --locked --target "$IOS_TARGET" -p horizon-client --no-default-features --features audio
      - name: Build and package the game with its launcher
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          ( cd packaging/ios && xcodegen generate )
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonIOS.xcodeproj \
            -target HorizonGame -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build-ios" build
          app=build-ios/HorizonGame.app
          test -d "$app"
          test -x "$app/Horizon"
          cmp "$app/Horizon" "target/$IOS_TARGET/release/horizon-client"
          test -s "$app/Assets.car"
          test -x "$app/Frameworks/HorizonLauncherKit.framework/HorizonLauncherKit"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle" = dev.horizon.game
          plutil -lint "$app/Info.plist"
          mkdir -p game-xcode/Payload
          cp -a "$app" game-xcode/Payload/
          ( cd game-xcode && zip -qry ../Horizon-game-with-launcher.ipa Payload )
          test -s Horizon-game-with-launcher.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-game-with-launcher
          path: Horizon-game-with-launcher.ipa
          retention-days: 3
          if-no-files-found: error
